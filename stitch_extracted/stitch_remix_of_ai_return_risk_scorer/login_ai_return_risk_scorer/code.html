<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Container for centering -->
<div class="w-full max-w-[420px] flex flex-col gap-lg">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-sm">
<!-- Logo Placeholder (Using a generic corporate icon for fintech) -->
<div class="w-16 h-16 bg-surface-container-high rounded-xl flex items-center justify-center mb-sm border border-outline-variant">
<span class="material-symbols-outlined text-primary" data-icon="account_balance" style="font-variation-settings: 'FILL' 1; font-size: 32px;">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">AI Return-Risk Scorer</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access your institutional dashboard</p>
</div>
<!-- Login Card / Form -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-md shadow-sm">
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-md py-[10px] font-body-md text-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary transition-colors" id="email" name="email" placeholder="analyst@institution.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-md py-[10px] font-body-md text-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest bg-surface" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant select-none cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm-mobile py-sm rounded-DEFAULT hover:bg-primary-container transition-colors shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.05)] flex items-center justify-center gap-sm mt-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="login" style="font-size: 18px;">login</span>
</button>
</form>
</div>
<!-- Security Footer -->
<div class="flex items-center justify-center gap-xs text-on-surface-variant mt-sm">
<span class="material-symbols-outlined" data-icon="lock" style="font-size: 16px; font-variation-settings: 'FILL' 1;">lock</span>
